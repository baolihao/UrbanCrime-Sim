[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbancrime-sim"
version = "0.1.0"
description = "Finite-element and agent-based models for urban crime and policing dynamics"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Baoli Hao"},
  {name = "Kamrun Mily"},
  {name = "Annalisa Quaini"},
  {name = "Ming Zhong"},
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.scripts]
urbancrime-pde = "urbancrime.cli:pde_main"
urbancrime-abm = "urbancrime.cli:abm_main"
urbancrime-compare-policies = "urbancrime.cli:policy_main"

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pyvista>=0.44", "meshio>=5.3"]
geo = ["geopandas>=0.14", "shapely>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "nbformat>=5.9", "nbclient>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "fenics: requires a working FEniCSx installation",
  "slow: long-running convergence or validation test",
]

[tool.ruff]
line-length = 100
target-version = "py310"
