schema_version: 1
name: no-police-highway-square

model:
  eta: {kind: constant, value: 0.3}
  ast:
    kind: analytic
    profile: diagonal_highway
    parameters:
      background: 0.03333333333333333
      amplitude: 0.03333333333333333
      sharpness: 20.0
      intercept: 16.0
      x_min: 8.0
      y_max: 8.0
  q:
    kind: analytic
    profile: diagonal_highway
    parameters:
      background: 1.0
      amplitude: 1.0
      sharpness: 20.0
      intercept: 16.0
      x_min: 8.0
      y_max: 8.0

policing: {strategy: none}

domain:
  kind: rectangle
  lower_left: [0.0, 0.0]
  upper_right: [16.0, 16.0]

mesh:
  cell_type: quadrilateral
  polynomial_degree: 1
  nx: 200
  ny: 200

time: {start: 0.0, final: 200.0, step: 0.02, save_every: 50}

initial_conditions:
  A: {kind: ast_plus_q_plus_noise}
  rho: {kind: constant_plus_noise, value: 0.8}
  noise:
    distribution: normal
    seed: 42
    A_standard_deviation: 0.05
    rho_standard_deviation: 0.01
    A_sparsity: 0.1
    rho_sparsity: 1.0

solver:
  method: partitioned
  relative_tolerance: 1.0e-9
  absolute_tolerance: 1.0e-12
  max_iterations: 500
  state_tolerance: 1.0e-12
  convergence_criterion: incremental
  block_order: [A, rho]
  petsc_options: {ksp_type: preonly, pc_type: lu}

output: {root: runs, fields: [A, rho], format: xdmf}
