schema_version: 1
name: no-police-case2-no-noise-square

model:
  eta: {kind: constant, value: 0.3}
  ast: {kind: constant, value: 0.03333333333333333}
  q: {kind: constant, value: 1.0}

policing: {strategy: none}

domain:
  kind: rectangle
  lower_left: [0.0, 0.0]
  upper_right: [16.0, 16.0]

mesh:
  cell_type: quadrilateral
  polynomial_degree: 1
  nx: 200
  ny: 200

time: {start: 0.0, final: 200.0, step: 0.02, save_every: 50}

initial_conditions:
  A: {kind: constant, value: 1.0333333333333334}
  rho: {kind: constant, value: 0.8}

solver:
  method: partitioned
  relative_tolerance: 1.0e-9
  absolute_tolerance: 1.0e-12
  max_iterations: 500
  state_tolerance: 1.0e-12
  convergence_criterion: incremental
  block_order: [A, rho]
  petsc_options: {ksp_type: preonly, pc_type: lu}

output: {root: runs, fields: [A, rho], format: xdmf}
