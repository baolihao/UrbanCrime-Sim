schema_version: 1
name: delayed-square

model:
  eta: {kind: constant, value: 0.15}
  ast: {kind: constant, value: 0.02}
  q: {kind: constant, value: 1.5}

policing:
  strategy: delayed
  tau: {kind: constant, value: 5.0}
  initial_mean_density: 0.5
  h_discretization: consistent

domain:
  kind: rectangle
  lower_left: [0.0, 0.0]
  upper_right: [10.0, 10.0]

mesh:
  cell_type: quadrilateral
  polynomial_degree: 1
  nx: 100
  ny: 100

time:
  start: 0.0
  final: 1000.0
  step: 0.02
  save_every: 50

initial_conditions:
  A: {kind: equilibrium_plus_noise, dynamic_attractiveness: 1.5}
  rho: {kind: constant_plus_noise, value: 0.6}
  pi: {kind: constant, value: 0.5}
  H: {kind: instantaneous_crime_signal}
  noise:
    distribution: normal
    seed: 42
    A_standard_deviation: 0.01
    rho_standard_deviation: 0.01
    sparsity: 1.0

solver:
  method: partitioned
  relative_tolerance: 1.0e-6
  absolute_tolerance: 1.0e-12
  max_iterations: 500
  state_tolerance: 1.0e-12
  convergence_criterion: incremental
  block_order: [A, rho, H, pi]
  petsc_options: {ksp_type: preonly, pc_type: lu}

output:
  root: runs
  fields: [A, rho, pi, H]
  format: xdmf
