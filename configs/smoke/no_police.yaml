schema_version: 1
name: smoke-no-police
model:
  eta: {kind: constant, value: 0.3}
  ast: {kind: constant, value: 0.03333333333333333}
  q: {kind: constant, value: 1.0}
policing: {strategy: none}
domain:
  kind: rectangle
  lower_left: [0.0, 0.0]
  upper_right: [2.0, 2.0]
mesh:
  cell_type: triangle
  polynomial_degree: 1
  nx: 8
  ny: 8
time: {start: 0.0, final: 0.1, step: 0.02, save_every: 1}
initial_conditions:
  A: {kind: constant, value: 1.0333333333333334}
  rho: {kind: constant, value: 0.6}
solver:
  method: implicit
  relative_tolerance: 1.0e-8
  absolute_tolerance: 1.0e-10
  max_iterations: 20
  state_tolerance: 1.0e-12
  convergence_criterion: incremental
  block_order: []
  petsc_options: {ksp_type: preonly, pc_type: lu}
output: {root: runs, fields: [A, rho], format: xdmf}
