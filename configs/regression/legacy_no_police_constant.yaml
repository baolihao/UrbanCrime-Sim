schema_version: 1
name: legacy-no-police-constant

model:
  eta: {kind: constant, value: 0.3}
  ast: {kind: constant, value: 0.03333333333333333}
  q: {kind: constant, value: 1.0}

policing: {strategy: none}

domain:
  kind: rectangle
  lower_left: [0.0, 0.0]
  upper_right: [1.0, 1.0]

mesh: {cell_type: triangle, polynomial_degree: 1, nx: 8, ny: 8}
time: {start: 0.0, final: 0.1, step: 0.02, save_every: 1}

initial_conditions:
  A:
    kind: analytic
    profile: trigonometric_product
    parameters:
      offset: 1.0333333333333334
      amplitude: 0.02
      x_wavelength: 1.0
      y_wavelength: 1.0
      x_frequency: 1.0
      y_frequency: 1.0
      x_phase: 0.0
      y_phase: 0.0
      x_function: cos
      y_function: cos
  rho:
    kind: analytic
    profile: trigonometric_product
    parameters:
      offset: 0.8
      amplitude: 0.01
      x_wavelength: 1.0
      y_wavelength: 1.0
      x_frequency: 1.0
      y_frequency: 1.0
      x_phase: 0.0
      y_phase: 0.0
      x_function: cos
      y_function: cos

solver:
  method: implicit
  relative_tolerance: 1.0e-14
  absolute_tolerance: 1.0e-14
  max_iterations: 50
  state_tolerance: 1.0e-12
  convergence_criterion: incremental
  block_order: []
  petsc_options: {ksp_type: preonly, pc_type: lu}

output: {root: runs, fields: [A, rho], format: xdmf}
